<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="robots" content="noindex,nofollow">
<meta name="apple-mobile-web-app-capable" content="yes">
<meta name="apple-mobile-web-app-title" content="Manifest">
<title>Morning Manifest</title>
<link rel="icon" href="data:image/svg+xml,%3Csvg xmlns=%27http://www.w3.org/2000/svg%27 viewBox=%270 0 32 32%27%3E%3Crect width=%2732%27 height=%2732%27 rx=%276%27 fill=%27%23C2410C%27/%3E%3Cpath d=%27M12 9v14l11-7z%27 fill=%27white%27/%3E%3C/svg%3E">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Bricolage+Grotesque:opsz,wght@12..96,500;12..96,700&family=Source+Sans+3:wght@400;600&family=JetBrains+Mono:wght@400;600&display=swap">
<style>
/* Layout: one narrow column; the latest episode is a "shipping label" card with the player, then show notes, then the archive. */
:root {
  --paper: #F2F4F3; --surface: #FFFFFF; --ink: #16201E; --muted: #5A6865; --line: #D3DBD8;
  --accent: #C2410C; --accent-ink: #FFFFFF;
  --display: "Bricolage Grotesque", "Avenir Next", system-ui, sans-serif;
  --body: "Source Sans 3", "Helvetica Neue", system-ui, sans-serif;
  --mono: "JetBrains Mono", ui-monospace, Menlo, monospace;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) { :root {
  --paper: #0E1413; --surface: #161E1C; --ink: #E4EBE9; --muted: #92A19E; --line: #27312F;
  --accent: #F0783C; --accent-ink: #1A0E07; color-scheme: dark } }
* { box-sizing: border-box }
[hidden] { display: none !important }
html { padding-top: env(safe-area-inset-top, 0px); padding-bottom: env(safe-area-inset-bottom, 0px); background: var(--paper) }
body { margin: 0; background: var(--paper); color: var(--ink); font: 17px/1.55 var(--body); }
.wrap { max-width: 680px; margin: 0 auto; padding-block: 28px 64px;
  padding-left: max(16px, env(safe-area-inset-left, 0px)); padding-right: max(16px, env(safe-area-inset-right, 0px));
  display: grid; gap: 28px; }
.mast { display: flex; justify-content: space-between; align-items: baseline; gap: 12px; flex-wrap: wrap; }
.mast h1 { font: 700 22px/1.1 var(--display); letter-spacing: -0.01em; margin: 0; }
.mast span, .meta, .src { font-family: var(--mono); font-size: 12px; letter-spacing: 0.06em; text-transform: uppercase; color: var(--muted); }
.linkbtn { font: 600 12px var(--mono); letter-spacing: .06em; text-transform: uppercase; background: none; border: 0; color: var(--muted); cursor: pointer; padding: 0; text-decoration: underline; text-underline-offset: 3px }

.label { background: var(--surface); border: 1.5px solid var(--ink); border-radius: 6px; overflow: hidden; }
.label .strip { display: flex; justify-content: space-between; gap: 8px; flex-wrap: wrap; padding: 8px 16px;
  border-bottom: 1.5px solid var(--ink); font: 600 12px/1.4 var(--mono); letter-spacing: 0.08em; text-transform: uppercase; }
.label .body { padding: 20px 16px 18px; display: grid; gap: 14px; }
.label h2 { font: 700 clamp(26px, 6vw, 36px)/1.08 var(--display); letter-spacing: -0.02em; margin: 0; text-wrap: balance; }
.label p { margin: 0; color: var(--muted); max-width: 60ch; }

.player { display: grid; grid-template-columns: auto 1fr; gap: 14px; align-items: center; }
.play { width: 64px; height: 64px; border-radius: 50%; border: 0; background: var(--accent); color: var(--accent-ink);
  display: grid; place-items: center; cursor: pointer; }
.play[disabled] { opacity: .5; cursor: progress }
.play:focus-visible, .chip:focus-visible, .ep:focus-visible, input:focus-visible, .go:focus-visible { outline: 3px solid var(--ink); outline-offset: 2px; }
.play svg { width: 26px; height: 26px; fill: currentColor; }
.scrub { display: grid; gap: 6px; min-width: 0; }
.times { display: flex; justify-content: space-between; font: 12px var(--mono); color: var(--muted); font-variant-numeric: tabular-nums; }
input[type=range] { width: 100%; accent-color: var(--accent); height: 20px; margin: 0; }
.ctrls { display: flex; gap: 8px; flex-wrap: wrap; }
.chip { font: 600 13px var(--mono); padding: 6px 10px; border-radius: 4px; border: 1px solid var(--line); background: transparent; color: var(--ink); cursor: pointer; font-variant-numeric: tabular-nums; }
.chip[aria-pressed="true"] { background: var(--ink); color: var(--paper); border-color: var(--ink); }
.status { font: 12px var(--mono); color: var(--muted); min-height: 1em }

section h3 { font: 700 15px/1.2 var(--display); text-transform: uppercase; letter-spacing: 0.08em; margin: 0 0 6px; }
.items { list-style: none; margin: 0; padding: 0; }
.items li { display: grid; gap: 2px; padding: 10px 0; border-top: 1px solid var(--line); }
.items a { color: var(--ink); text-decoration-color: var(--accent); text-underline-offset: 3px; }
.items .src { text-transform: none; letter-spacing: 0.02em; }

.archive { display: grid; }
.ep { display: grid; grid-template-columns: 4.5em 1fr auto; gap: 12px; align-items: baseline; text-align: left;
  background: none; border: 0; border-top: 1px solid var(--line); padding: 12px 0; color: var(--ink); font: inherit; cursor: pointer; }
.ep[aria-current="true"] .t { color: var(--accent); }
.ep .t { font-weight: 600; min-width: 0; }
.ep .meta { font-variant-numeric: tabular-nums; }
@media (max-width: 460px) { .ep { grid-template-columns: 4em 1fr } .ep .meta:last-child { grid-column: 2 } }

.lock { max-width: 420px; margin: 12vh auto 0; display: grid; gap: 14px; }
.lock h2 { font: 700 34px/1.05 var(--display); margin: 0; letter-spacing: -0.02em }
.lock p { margin: 0; color: var(--muted) }
.lock input[type=password] { font: 17px var(--mono); padding: 12px 14px; border-radius: 6px; border: 1.5px solid var(--ink); background: var(--surface); color: var(--ink); width: 100% }
.lock label { display: flex; gap: 8px; align-items: center; color: var(--muted); font-size: 15px }
.go { font: 700 16px var(--display); padding: 12px 16px; border-radius: 6px; border: 0; background: var(--accent); color: var(--accent-ink); cursor: pointer }
.err { color: var(--accent); font: 13px var(--mono); min-height: 1em }
@media (prefers-reduced-motion: no-preference) { .play { transition: transform .12s } .play:active { transform: scale(.95) } }
</style>
</head>
<body>
<div class="wrap">
  <header class="mast"><h1>Morning Manifest</h1><span id="tag">Daily brief</span></header>

  <form class="lock" id="lock">
    <h2>Unlock today's brief</h2>
    <p>Episodes are encrypted. Enter the password to decrypt them on this device.</p>
    <input type="password" id="pw" autocomplete="current-password" placeholder="password" aria-label="Password" required>
    <label><input type="checkbox" id="remember" checked> Remember on this device</label>
    <button class="go" id="go" type="submit">Unlock</button>
    <div class="err" id="err"></div>
  </form>

  <div id="app" hidden style="display:grid;gap:28px">
    <article class="label">
      <div class="strip"><span id="ep-no">EP —</span><span id="ep-date"></span><span id="ep-len"></span></div>
      <div class="body">
        <h2 id="ep-title"></h2>
        <p id="ep-sum"></p>
        <div class="player">
          <button class="play" id="play" aria-label="Play"><svg viewBox="0 0 24 24" id="icon"><path d="M7 4.5v15l13-7.5z"/></svg></button>
          <div class="scrub">
            <input type="range" id="seek" min="0" max="100" value="0" step="1" aria-label="Seek">
            <div class="times"><span id="cur">0:00</span><span id="dur">0:00</span></div>
          </div>
        </div>
        <div class="ctrls">
          <button class="chip" id="back">−15s</button>
          <button class="chip" id="fwd">+30s</button>
          <button class="chip" data-rate="1">1×</button>
          <button class="chip" data-rate="1.25">1.25×</button>
          <button class="chip" data-rate="1.5">1.5×</button>
          <button class="chip" data-rate="2">2×</button>
        </div>
        <div class="status" id="status"></div>
      </div>
    </article>
    <div id="notes" style="display:grid;gap:22px"></div>
    <section><h3>All episodes</h3><div class="archive" id="archive"></div></section>
    <div><button class="linkbtn" id="forget">Lock this device</button></div>
  </div>
</div>
<audio id="audio" preload="none" playsinline></audio>

<script>
const CFG = {"salt":"33076e6fb5876c885fd61acf27287b59","iterations":600000,"version":"23294e9107"};
const $ = id => document.getElementById(id);
const audio = $("audio");
const store = { get(k) { try { return localStorage.getItem(k) } catch { return null } },
                set(k, v) { try { localStorage.setItem(k, v) } catch {} },
                del(k) { try { localStorage.removeItem(k) } catch {} } };
const fmt = s => { s = Math.max(0, Math.floor(s || 0)); return Math.floor(s / 60) + ":" + String(s % 60).padStart(2, "0") };
const dateLabel = d => new Date(d + "T12:00:00").toLocaleDateString("en-US", { weekday: "short", month: "short", day: "numeric" });
const PLAY = '<path d="M7 4.5v15l13-7.5z"/>', PAUSE = '<path d="M6 4h4.5v16H6zM13.5 4H18v16h-4.5z"/>';
const hex = h => new Uint8Array(h.match(/../g).map(x => parseInt(x, 16)));
const b64 = { enc: u => btoa(String.fromCharCode(...u)), dec: s => Uint8Array.from(atob(s), c => c.charCodeAt(0)) };
let KEY = null, EPISODES = [], current = null, blobUrl = null, loadToken = 0;

async function deriveKey(pw) {
  const base = await crypto.subtle.importKey("raw", new TextEncoder().encode(pw), "PBKDF2", false, ["deriveBits"]);
  const bits = await crypto.subtle.deriveBits({ name: "PBKDF2", hash: "SHA-256", salt: hex(CFG.salt), iterations: CFG.iterations }, base, 256);
  return new Uint8Array(bits);
}
const importKey = raw => crypto.subtle.importKey("raw", raw, "AES-GCM", false, ["decrypt"]);
async function decrypt(buf) {
  const u = new Uint8Array(buf);
  return crypto.subtle.decrypt({ name: "AES-GCM", iv: u.slice(0, 12) }, KEY, u.slice(12));
}
async function fetchBin(path) {
  const r = await fetch(path + "?v=" + (CFG.version || Date.now()), { cache: "no-cache" });
  if (!r.ok) throw new Error(path + " " + r.status);
  return r.arrayBuffer();
}

async function unlock(raw, remember) {
  KEY = await importKey(raw);
  const manifest = JSON.parse(new TextDecoder().decode(await decrypt(await fetchBin("data/manifest.bin"))));
  if (remember) store.set("mm:key", b64.enc(raw));
  EPISODES = manifest.episodes;
  $("lock").hidden = true; $("app").hidden = false;
  renderArchive();
  const want = location.hash.slice(1);
  load(EPISODES.find(e => e.date === want) || EPISODES[0], false);
}

$("lock").addEventListener("submit", async e => {
  e.preventDefault(); $("err").textContent = ""; $("go").disabled = true; $("go").textContent = "Unlocking…";
  try { await unlock(await deriveKey($("pw").value), $("remember").checked) }
  catch (err) { $("err").textContent = "That password didn't work. Try again."; KEY = null }
  finally { $("go").disabled = false; $("go").textContent = "Unlock" }
});
$("forget").onclick = () => { store.del("mm:key"); location.reload() };

function el(tag, props, ...kids) { const e = document.createElement(tag); Object.assign(e, props || {}); kids.forEach(k => k && e.append(k)); return e }

async function load(ep, autoplay) {
  if (!ep) return;
  current = ep; const token = ++loadToken;
  $("ep-no").textContent = "EP " + String(ep.num).padStart(3, "0");
  $("ep-date").textContent = dateLabel(ep.date);
  $("ep-len").textContent = fmt(ep.secs);
  $("ep-title").textContent = ep.title;
  $("ep-sum").textContent = ep.summary;
  $("dur").textContent = fmt(ep.secs); $("cur").textContent = "0:00";
  $("seek").max = ep.secs; $("seek").value = 0;
  const notes = $("notes"); notes.replaceChildren();
  ep.segments.forEach(seg => {
    const ul = el("ul", { className: "items" });
    seg.items.forEach(it => {
      const head = it.link ? el("a", { href: it.link, target: "_blank", rel: "noopener", textContent: it.headline }) : el("span", { textContent: it.headline });
      ul.append(el("li", {}, head, el("span", { className: "src", textContent: it.source })));
    });
    notes.append(el("section", {}, el("h3", { textContent: seg.name }), ul));
  });
  document.querySelectorAll(".ep").forEach(b => b.setAttribute("aria-current", b.dataset.date === ep.date));
  if ("mediaSession" in navigator) navigator.mediaSession.metadata = new MediaMetadata({ title: ep.title, artist: "Morning Manifest", album: dateLabel(ep.date) });
  audio.pause(); audio.removeAttribute("src");
  if (blobUrl) { URL.revokeObjectURL(blobUrl); blobUrl = null }
  $("play").disabled = true; $("status").textContent = "Decrypting audio…";
  try {
    const plain = await decrypt(await fetchBin(ep.audio));
    if (token !== loadToken) return;
    blobUrl = URL.createObjectURL(new Blob([plain], { type: "audio/mp4" }));
    audio.src = blobUrl; audio.playbackRate = parseFloat(store.get("rate") || "1");
    const saved = parseFloat(store.get("pos:" + ep.date) || "0");
    audio.addEventListener("loadedmetadata", () => { if (saved > 5 && saved < ep.secs - 5) audio.currentTime = saved }, { once: true });
    $("status").textContent = ""; $("play").disabled = false;
    if (autoplay) audio.play().catch(() => {});
  } catch (err) {
    if (token === loadToken) $("status").textContent = ep.audio_missing ? "Audio for this episode has expired; show notes are kept." : "Couldn't load the audio. Reload to try again.";
  }
}

function renderArchive() {
  const box = $("archive"); box.replaceChildren();
  EPISODES.forEach(ep => {
    const b = el("button", { className: "ep" },
      el("span", { className: "meta", textContent: "EP " + String(ep.num).padStart(3, "0") }),
      el("span", { className: "t", textContent: ep.title }),
      el("span", { className: "meta", textContent: dateLabel(ep.date) + " · " + fmt(ep.secs) }));
    b.dataset.date = ep.date;
    b.onclick = () => { load(ep, true); history.replaceState(null, "", "#" + ep.date); window.scrollTo({ top: 0, behavior: "smooth" }) };
    box.append(b);
  });
}

$("play").onclick = () => { if (!audio.src) return; audio.paused ? audio.play().catch(() => {}) : audio.pause() };
audio.onplay = () => { $("icon").innerHTML = PAUSE; $("play").setAttribute("aria-label", "Pause") };
audio.onpause = () => { $("icon").innerHTML = PLAY; $("play").setAttribute("aria-label", "Play") };
audio.ontimeupdate = () => {
  $("cur").textContent = fmt(audio.currentTime);
  if (!$("seek").matches(":active")) $("seek").value = audio.currentTime;
  if (current) store.set("pos:" + current.date, audio.currentTime);
};
audio.onended = () => current && store.set("pos:" + current.date, "0");
$("seek").oninput = e => { audio.currentTime = +e.target.value };
$("back").onclick = () => { audio.currentTime = Math.max(0, audio.currentTime - 15) };
$("fwd").onclick = () => { audio.currentTime = Math.min(audio.duration || 1e9, audio.currentTime + 30) };
const rates = document.querySelectorAll("[data-rate]");
function setRate(r) { audio.playbackRate = r; store.set("rate", r); rates.forEach(b => b.setAttribute("aria-pressed", +b.dataset.rate === r)) }
rates.forEach(b => b.onclick = () => setRate(+b.dataset.rate));
setRate(parseFloat(store.get("rate") || "1"));
if ("mediaSession" in navigator) {
  navigator.mediaSession.setActionHandler("seekbackward", () => $("back").click());
  navigator.mediaSession.setActionHandler("seekforward", () => $("fwd").click());
}

const saved = store.get("mm:key");
if (saved) unlock(b64.dec(saved), true).catch(() => { store.del("mm:key"); KEY = null });
else $("pw").focus();
</script>
</body>
</html>
